name: release

# Builds CLIProxyAPI plugin-store assets for a version bump on main or a v<version> tag:
# <id>_<version>_<goos>_<goarch>.zip (library at the zip root) and checksums.txt.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths: ["core.go"]

permissions:
  contents: write

env:
  PLUGIN_ID: media-studio

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Read and validate release version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^var pluginVersion = "\([0-9][0-9.]*\)"/\1/p' core.go)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The tag must match the plugin version in core.go."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Regression checks
        run: |
          go vet ./...
          go test -race -count=1 ./...
          node --check app.mjs
          node --check models.mjs
          node --check realtime.mjs
          node --check browser-checks.js
          node --test models.test.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'

  windows-linux:
    needs: validation
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.validation.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Build
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p dist
          # glibc 2.17 keeps the .so loadable on older distributions and Docker images.
          for spec in windows/amd64/x86_64-windows-gnu/dll windows/arm64/aarch64-windows-gnu/dll linux/amd64/x86_64-linux-gnu.2.17/so linux/arm64/aarch64-linux-gnu.2.17/so; do
            IFS=/ read -r goos goarch zigtarget ext <<<"$spec"
            stage="stage/$goos-$goarch"
            mkdir -p "$stage"
            CGO_ENABLED=1 GOOS=$goos GOARCH=$goarch CC="zig cc -target $zigtarget" \
              go build -buildmode=c-shared -trimpath -ldflags "-s -w -X main.pluginVersion=$version" -o "$stage/$PLUGIN_ID.$ext" .
            (cd "$stage" && zip -q "../../dist/${PLUGIN_ID}_${version}_${goos}_${goarch}.zip" "$PLUGIN_ID.$ext")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: dist/*.zip

  darwin:
    needs: validation
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.validation.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          mkdir -p dist
          for goarch in amd64 arm64; do
            arch=$([ "$goarch" = amd64 ] && echo x86_64 || echo arm64)
            stage="stage/darwin-$goarch"
            mkdir -p "$stage"
            CGO_ENABLED=1 GOOS=darwin GOARCH=$goarch CC="clang -arch $arch" \
              go build -buildmode=c-shared -trimpath -ldflags "-s -w -X main.pluginVersion=$version" -o "$stage/$PLUGIN_ID.dylib" .
            (cd "$stage" && zip -q "../../dist/${PLUGIN_ID}_${version}_darwin_${goarch}.zip" "$PLUGIN_ID.dylib")
          done
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/*.zip

  release:
    needs: [validation, windows-linux, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > checksums.txt
          python3 "$GITHUB_WORKSPACE/scripts/verify_release.py" --version "$RELEASE_VERSION" --directory .
          gh release create "v$RELEASE_VERSION" *.zip checksums.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --generate-notes
