name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Go and ABI checks
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -buildmode=c-shared -trimpath -o /tmp/media-studio.so .
      - name: JavaScript checks
        run: |
          node --check app.mjs
          node --check models.mjs
          node --check realtime.mjs
          node --check browser-checks.js
          node --test models.test.mjs
      - name: Release packaging regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  windows-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Cross-build and check Windows ARM64 library
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: arm64
          CC: zig cc -target aarch64-windows-gnu
        run: |
          go build -buildmode=c-shared -trimpath -o /tmp/media-studio.dll .
          python3 -c "from pathlib import Path; from scripts.verify_release import verify_architecture; verify_architecture(Path('/tmp/media-studio.dll').read_bytes(), 'windows', 'arm64')"
